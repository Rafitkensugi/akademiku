{% extends "base.html" %}
{% block judul %}Masuk - AkademikKu{% endblock %}

{% block isi %}
<div class="kotak-auth">
    <h2>Masuk</h2>
    <form method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ isian.get('email', '') }}" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="tombol tombol-penuh">Masuk</button>
    </form>
    <p class="catatan">Belum punya akun? <a href="{{ url_for('register') }}">Daftar di sini</a></p>
</div>
{% endblock %}
